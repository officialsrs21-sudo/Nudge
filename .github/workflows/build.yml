name: Build Nudge APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project
        run: |
          mkdir www && cp index.html www/index.html
          cat > package.json <<'EOT'
          {"name":"nudge","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.0.0","@capacitor/core":"^6.0.0","@capacitor/local-notifications":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.0.0"}}
          EOT
          echo '{"appId":"com.nudge.taskalarm","appName":"Nudge","webDir":"www"}' > capacitor.config.json
          npm install
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Nudge v${{ github.run_number }}" --notes "Download app-debug.apk and install it."
